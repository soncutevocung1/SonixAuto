<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; font-family: 'Montserrat', 'Be Vietnam Pro', Arial, sans-serif; }
  #the { position: absolute; left: 50%; top: 50%; display: flex; align-items: stretch; gap: 0; border-radius: 34px; overflow: hidden;
    box-shadow: 0 10px 40px rgba(0,0,0,.45), 0 0 0 5px rgba(255,255,255,.95), 0 0 34px 10px rgba(255,255,255,.35); }
  .o { padding: 26px 34px 22px; text-align: center; min-width: 330px; white-space: nowrap; }
  .o1 { background: #1b7a3a; color: #fff; }
  .o2 { background: #fff; color: #1b7a3a; }
  .so { font-size: 120px; font-weight: 900; line-height: 1; letter-spacing: -2px; display: inline-block; }
  .dv { font-size: 46px; font-weight: 800; margin-left: 6px; }
  .nh { font-size: 34px; font-weight: 700; opacity: .9; margin-top: 8px; }
  #gach { width: 0; }
</style>
<script src="../engine/lib/runtime.js"></script>
</head><body>
<div id="the">
  <div class="o o1"><span class="so" id="s1"></span><span class="dv" id="d1"></span><div class="nh" id="n1"></div></div>
  <div class="o o2"><span class="so" id="s2"></span><span class="dv" id="d2"></span><div class="nh" id="n2"></div></div>
</div>
<script>
  // props: { at, dur, y, o1: {tu, den, dv, nhan}, o2: {...} } vd o1 {tu:4, den:5, dv:"nắp"}, o2 {tu:16, den:20, dv:"lít", nhan:"1 bình phun"}
  const P = SX.props, H = window.__SX_H__ || 1920;
  const at = P.at ?? 0.1, dur = P.dur ?? 3;
  window.SX_META = { duration: P.duration ?? at + dur + 0.1 };
  const the = document.getElementById('the');
  const O = [P.o1 || { tu: 4, den: 5, dv: 'nắp', nhan: 'đạm cá' }, P.o2 || { tu: 16, den: 20, dv: 'lít', nhan: '1 bình phun' }];
  O.forEach((o, i) => {
    document.getElementById('d' + (i + 1)).textContent = o.dv; document.getElementById('n' + (i + 1)).textContent = o.nhan || '';
    // giu be rong theo so cuoi cung -> the khong no ra khi dem
    const s = document.getElementById('s' + (i + 1));
    s.textContent = o.tu !== undefined && o.tu !== o.den ? `${o.tu}-${o.den}` : `${o.den}`;
    s.style.minWidth = s.getBoundingClientRect().width + 'px'; s.style.textAlign = 'right';
  });
  const VAO = { stiffness: 260, damping: 18 }, DEM = { stiffness: 70, damping: 16 }, NAY = { stiffness: 500, damping: 12, mass: 0.6 };

  window.renderFrame = (f) => {
    const fps = SX.fps, t = f / fps;
    if (t < at || t > at + dur) { the.style.opacity = 0; return; }
    const s = SX.spring({ frame: f, fps, delay: at, config: VAO });
    const ra = SX.interpolate(t, [at + dur - 0.2, at + dur], [1, 0]);
    the.style.opacity = Math.min(1, s * 3) * ra;
    the.style.transform = `translate(-50%,-50%) translate(0, ${((P.y ?? 0.5) - 0.5) * H}px) scale(${0.6 + 0.4 * s}) rotate(${(1 - s) * -6}deg)`;
    O.forEach((o, i) => {
      // so dem: hien "tu" truoc, roi chay len "den" (vd 4 -> 4-5); neu tu==den chi dem 0 -> den
      const d = SX.spring({ frame: f, fps, delay: at + 0.25 + i * 0.35, config: DEM });
      const el = document.getElementById('s' + (i + 1));
      let hien;
      if (o.tu !== undefined && o.tu !== o.den) {
        // hien "4" truoc, roi moi chay "4-5" (tranh "4-4" kho doc)
        const cur = Math.round(o.tu + (o.den - o.tu) * Math.min(1, d));
        hien = d < 0.12 ? `${o.tu}` : `${o.tu}-${Math.max(o.tu + 1, cur)}`;
      } else hien = `${Math.max(1, Math.round(o.den * Math.min(1, d)))}`;
      el.textContent = hien;
      // nay nhe khi so dung lai
      const n = SX.spring({ frame: f, fps, delay: at + 0.25 + i * 0.35 + 0.55, config: NAY });
      el.style.transform = `scale(${1 + 0.18 * Math.sin(Math.min(1, n) * Math.PI) * (1 - Math.min(1, Math.max(0, n - 1)))})`;
    });
  };
</script>
</body></html>
